<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CulinaryPath — Plataforma de Aprendizaje</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,300;0,400&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* ─── Variables & Reset ─────────────────────────────────────────── */
:root {
  --bg-deep:    #07070f;
  --bg-dark:    #0b0b18;
  --bg-panel:   #10101e;
  --bg-card:    #14142a;
  --bg-raised:  #1a1a32;
  --border:     rgba(79,70,229,0.25);
  --border-md:  rgba(79,70,229,0.45);
  --indigo:     #4f46e5;
  --indigo-lt:  #818cf8;
  --indigo-dim: rgba(79,70,229,0.12);
  --pink:       #ff1493;
  --pink-lt:    #ff69b4;
  --pink-dim:   rgba(255,20,147,0.12);
  --teal:       #0d9488;
  --amber:      #d97706;
  --violet:     #7c3aed;
  --rose:       #e11d48;
  --txt-1:      #e8e8f2;
  --txt-2:      #9090b8;
  --txt-3:      #44446a;
  --txt-4:      #2a2a48;
  --f-disp:     'Rajdhani', sans-serif;
  --f-mono:     'JetBrains Mono', monospace;
  --f-body:     'Lora', serif;
  --sb-w:       298px;
  --cell:       68px;
  --node:       52px;
  --r:          0px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--bg-deep); color: var(--txt-1); font-family: var(--f-body); }

/* ─── Layout ────────────────────────────────────────────────────── */
#app { display: flex; height: 100vh; overflow: hidden; }

/* ─── Sidebar ───────────────────────────────────────────────────── */
.sidebar {
  width: var(--sb-w); min-width: var(--sb-w);
  background: var(--bg-dark);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden; position: relative;
}
.sidebar::before {
  content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 1;
  background: repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.1) 3px,rgba(0,0,0,.1) 4px);
}
.sidebar-header {
  padding: 18px 18px 14px; border-bottom: 1px solid var(--border);
  position: relative; z-index: 2; flex-shrink: 0;
}
.sidebar-label {
  font-family: var(--f-mono); font-size: 9px; font-weight: 400;
  letter-spacing: .18em; color: var(--txt-3); display: block; margin-bottom: 4px;
}
.sidebar-title {
  font-family: var(--f-disp); font-size: 21px; font-weight: 700;
  letter-spacing: .04em; color: var(--txt-1); line-height: 1.1;
  margin-bottom: 6px;
}
.sidebar-meta {
  font-family: var(--f-mono); font-size: 9px; color: var(--txt-3);
  display: flex; gap: 6px; align-items: center;
}
.sidebar-meta .sep { color: var(--txt-4); }
.sidebar-meta span { color: var(--indigo-lt); }
.sidebar-meta .sep { color: var(--txt-4); }

.skill-tree-scroll {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: 18px 14px 10px;
  position: relative; z-index: 2;
  scrollbar-width: thin; scrollbar-color: var(--indigo) transparent;
}
.skill-tree-scroll::-webkit-scrollbar { width: 4px; }
.skill-tree-scroll::-webkit-scrollbar-track { background: transparent; }
.skill-tree-scroll::-webkit-scrollbar-thumb { background: var(--indigo); }

/* Phase legend */
.sidebar-legend {
  padding: 10px 14px 14px; border-top: 1px solid var(--border);
  position: relative; z-index: 2; flex-shrink: 0;
}
.legend-title {
  font-family: var(--f-mono); font-size: 8px; letter-spacing: .16em;
  color: var(--txt-3); margin-bottom: 8px; text-transform: uppercase;
}
.legend-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; }
.legend-item {
  display: flex; align-items: center; gap: 6px;
  font-family: var(--f-mono); font-size: 9px; color: var(--txt-2);
}
.legend-dot { width: 7px; height: 7px; flex-shrink: 0; border: 1px solid; }

/* ─── Content Area ──────────────────────────────────────────────── */
.content-area { flex: 1; overflow-y: auto; background: var(--bg-deep); scrollbar-width: thin; scrollbar-color: var(--border-md) transparent; }
.content-area::-webkit-scrollbar { width: 4px; }
.content-area::-webkit-scrollbar-thumb { background: var(--border-md); }

/* ─── Skill Tree Component ──────────────────────────────────────── */
.skill-tree-wrap { position: relative; }
.tree-svg { position: absolute; top: 0; left: 0; pointer-events: none; overflow: visible; }

.snode {
  position: absolute; cursor: pointer;
  width: var(--node); height: var(--node);
  transform: translate(-50%, -50%);
  transition: filter .15s;
}
.snode:hover { filter: brightness(1.4); }
.snode:hover .snode-inner { transform: scale(1.06); }

.snode-inner {
  width: 100%; height: 100%; position: relative;
  background: var(--bg-card); border: 1px solid var(--node-color, var(--indigo));
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  transition: transform .15s, box-shadow .2s, background .2s;
}
.snode.active .snode-inner {
  border-color: var(--pink) !important;
  background: rgba(255,20,147,.1) !important;
  box-shadow: 0 0 0 1px var(--pink), 0 0 18px rgba(255,20,147,.45), 0 0 40px rgba(255,20,147,.15);
}
.snode.active .snode-label { color: var(--pink-lt) !important; }
.snode.active .snode-icon { transform: scale(1.1); }

/* Corner brackets */
.snode-inner::before, .snode-inner::after,
.snode-c1, .snode-c2 {
  content: ''; position: absolute; width: 7px; height: 7px;
}
.snode-inner::before { top: 2px; left: 2px; border-top: 1px solid var(--node-color, var(--indigo)); border-left: 1px solid var(--node-color, var(--indigo)); opacity: .7; }
.snode-inner::after  { top: 2px; right: 2px; border-top: 1px solid var(--node-color, var(--indigo)); border-right: 1px solid var(--node-color, var(--indigo)); opacity: .7; }
.snode-c1 { bottom: 2px; left: 2px; border-bottom: 1px solid var(--node-color, var(--indigo)); border-left: 1px solid var(--node-color, var(--indigo)); opacity: .7; }
.snode-c2 { bottom: 2px; right: 2px; border-bottom: 1px solid var(--node-color, var(--indigo)); border-right: 1px solid var(--node-color, var(--indigo)); opacity: .7; }

.snode-icon { font-size: 17px; line-height: 1; }
.snode-label {
  font-family: var(--f-disp); font-size: 7.5px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .04em;
  text-align: center; color: var(--txt-2); padding: 0 3px; line-height: 1.2;
  transition: color .15s;
}

/* Tooltip on hover */
.snode[data-tooltip]:hover::after {
  content: attr(data-tooltip);
  position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
  background: var(--bg-raised); border: 1px solid var(--border-md);
  color: var(--txt-1); font-family: var(--f-disp); font-size: 11px; font-weight: 600;
  letter-spacing: .03em; white-space: nowrap; padding: 5px 10px;
  pointer-events: none; z-index: 100; text-transform: none;
}

/* ─── Content Viewer Empty State ────────────────────────────────── */
.viewer-empty {
  height: 100%; min-height: 100vh;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; color: var(--txt-3); padding: 40px;
}
.viewer-empty-icon { font-size: 52px; opacity: .35; filter: grayscale(.5); }
.viewer-empty-title {
  font-family: var(--f-disp); font-size: 15px; font-weight: 600;
  letter-spacing: .16em; text-transform: uppercase; color: var(--txt-3);
}
.viewer-empty-sub { font-family: var(--f-mono); font-size: 10px; color: var(--txt-4); letter-spacing: .1em; }
.viewer-empty-arrows {
  margin-top: 12px; font-family: var(--f-mono); font-size: 9px; color: var(--txt-4);
  letter-spacing: .08em; display: flex; align-items: center; gap: 8px;
}
.viewer-empty-arrows span { color: var(--indigo); font-size: 14px; animation: blink 1.4s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

/* ─── Topic Viewer Layout ───────────────────────────────────────── */
.topic-viewer {
  padding: 28px 32px 40px; max-width: 1200px;
  animation: fadeIn .3s ease;
}
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }

.topic-header { margin-bottom: 22px; }
.phase-badge {
  display: inline-flex; align-items: center; gap: 7px;
  font-family: var(--f-mono); font-size: 9px; letter-spacing: .18em;
  text-transform: uppercase; padding: 4px 11px;
  border: 1px solid; margin-bottom: 10px;
}
.phase-badge-dot { width: 5px; height: 5px; border-radius: 50%; }
.topic-title {
  font-family: var(--f-disp); font-size: 30px; font-weight: 700;
  letter-spacing: .03em; margin-bottom: 7px; line-height: 1.1;
}
.topic-desc { font-size: 14.5px; color: var(--txt-2); font-style: italic; max-width: 560px; line-height: 1.6; }

/* Body grid */
.topic-body { display: grid; grid-template-columns: 1fr 300px; gap: 22px; align-items: start; }
@media (max-width: 1050px) { .topic-body { grid-template-columns: 1fr; } }

/* Video */
.video-wrapper {
  position: relative; padding-bottom: 56.25%; background: #000;
  border: 1px solid var(--border); overflow: hidden;
}
.video-wrapper iframe {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;
}
.video-placeholder {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 10px;
  background: var(--bg-panel); color: var(--txt-3);
}
.video-placeholder-icon { font-size: 36px; opacity: .4; }
.video-placeholder-text { font-family: var(--f-mono); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; }

/* Chapters */
.chapters-section { margin-top: 18px; }
.section-label {
  font-family: var(--f-mono); font-size: 9px; font-weight: 400;
  letter-spacing: .2em; text-transform: uppercase; color: var(--txt-3);
  margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
}
.section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.chapters-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }

.chap-card {
  background: var(--bg-card); border: 1px solid var(--border);
  padding: 11px 12px; cursor: pointer; transition: all .18s; position: relative; overflow: hidden;
}
.chap-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--indigo); opacity: 0; transition: opacity .18s; }
.chap-card:hover { border-color: var(--border-md); background: var(--indigo-dim); }
.chap-card:hover::before { opacity: 1; }
.chap-card.active { border-color: var(--pink); background: var(--pink-dim); }
.chap-card.active::before { background: var(--pink); opacity: 1; }

.chap-num { font-family: var(--f-mono); font-size: 8px; color: var(--txt-4); margin-bottom: 4px; letter-spacing: .1em; }
.chap-title { font-family: var(--f-disp); font-size: 12px; font-weight: 600; color: var(--txt-1); margin-bottom: 5px; line-height: 1.3; }
.chap-time { font-family: var(--f-mono); font-size: 9px; color: var(--indigo-lt); }
.chap-card.active .chap-time { color: var(--pink-lt); }

/* Highlights */
.highlights-panel {
  background: var(--bg-panel); border: 1px solid var(--border);
  display: flex; flex-direction: column; max-height: 540px;
  position: sticky; top: 20px;
}
.hl-header {
  padding: 12px 14px; border-bottom: 1px solid var(--border);
  font-family: var(--f-mono); font-size: 9px; font-weight: 400; letter-spacing: .18em;
  text-transform: uppercase; color: var(--txt-2);
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
}
.hl-header-icon { color: var(--amber); }
.hl-count { margin-left: auto; color: var(--txt-3); font-size: 8px; }

.hl-list { overflow-y: auto; flex: 1; scrollbar-width: thin; scrollbar-color: var(--border-md) transparent; }
.hl-list::-webkit-scrollbar { width: 3px; }
.hl-list::-webkit-scrollbar-thumb { background: var(--border-md); }

.hl-item {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 11px 14px; cursor: pointer;
  border-bottom: 1px solid rgba(79,70,229,.08);
  transition: background .14s;
}
.hl-item:hover { background: var(--indigo-dim); }
.hl-item.active { background: var(--pink-dim); border-left: 2px solid var(--pink); }
.hl-item:last-child { border-bottom: none; }

.hl-time {
  font-family: var(--f-mono); font-size: 10px; color: var(--indigo-lt);
  white-space: nowrap; padding-top: 1px; min-width: 36px; flex-shrink: 0;
}
.hl-item.active .hl-time { color: var(--pink-lt); }

.hl-info { flex: 1; min-width: 0; }
.hl-title { font-family: var(--f-disp); font-size: 12.5px; font-weight: 600; color: var(--txt-1); margin-bottom: 2px; line-height: 1.3; }
.hl-desc { font-size: 11px; color: var(--txt-2); line-height: 1.4; }
.hl-item.active .hl-title { color: var(--pink-lt); }

.hl-play {
  width: 22px; height: 22px; flex-shrink: 0; margin-top: 1px;
  background: transparent; border: 1px solid var(--border-md);
  color: var(--indigo-lt); display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all .14s; font-size: 8px; padding: 0;
}
.hl-item:hover .hl-play { background: var(--indigo); border-color: var(--indigo); color: #fff; }
.hl-item.active .hl-play { background: var(--pink); border-color: var(--pink); color: #fff; }

/* Connection lines animation */
.tree-line { transition: stroke-opacity .3s; }
.tree-line:hover { stroke-opacity: .8 !important; }
</style>
</head>

/* ── Tree node coordinates (col, row) ── */
const LAYOUT = {
  seguridad:  [0,0], cuchillos: [0,2], mise:      [0,4], calor:     [0,6],
  salteado:   [1,1], estofado:  [1,3], horneado:  [1,5],
  fondos:     [2,0], madres:    [2,2], emulsiones:[2,4],
  pasta:      [3,1], arroces:   [3,3], legumbres: [3,5],
  masas:      [2,6], cremas:    [1,7], merengues: [3,7],
};

const EDGES = [
  ['seguridad','salteado'], ['cuchillos','salteado'], ['cuchillos','estofado'],
  ['mise','estofado'],      ['mise','horneado'],       ['calor','horneado'],
  ['salteado','fondos'],    ['salteado','pasta'],
  ['estofado','madres'],    ['estofado','arroces'],
  ['horneado','emulsiones'],['horneado','legumbres'],
  ['fondos','madres'],      ['madres','emulsiones'],
  ['pasta','arroces'],      ['arroces','legumbres'],
  ['emulsiones','masas'],   ['legumbres','merengues'],
  ['masas','cremas'],       ['masas','merengues'],
];

/* ── Helper: find topic/phase by id ── */
function findTopic(id) {
  for (const ph of COURSE.phases)
    for (const t of ph.topics)
      if (t.id === id) return { topic:t, phase:ph };
  return null;
}
function topicMap() {
  const m = {};
  for (const ph of COURSE.phases)
    for (const t of ph.topics)
      m[t.id] = { ...t, phaseColor: ph.color, phaseLabel: ph.label };
  return m;
}
const TOPIC_MAP = topicMap();

function secToStr(s) {
  const m = Math.floor(s/60), ss = s%60;
  return `${m}:${String(ss).padStart(2,'0')}`;
}

/* ═══════════════════════════════════════════════════════════════════
   SKILL-TREE COMPONENT
═══════════════════════════════════════════════════════════════════ */
class SkillTree extends HTMLElement {
  constructor() { super(); this._active = null; }
  connectedCallback() { this._render(); }

  _center(id) {
    const [c,r] = LAYOUT[id];
    const CELL = 68;
    return { x: c*CELL + CELL/2, y: r*CELL + CELL/2 };
  }

  _render() {
    const CELL = 68;
    const cols = Math.max(...Object.values(LAYOUT).map(([c])=>c)) + 1;
    const rows = Math.max(...Object.values(LAYOUT).map(([,r])=>r)) + 1;
    const W = cols * CELL, H = rows * CELL + CELL;

    /* SVG edges */
    const lines = EDGES.map(([a,b]) => {
      const pa = this._center(a), pb = this._center(b);
      const t = TOPIC_MAP[a];
      const col = t ? t.phaseColor : '#4f46e5';
      return `<line class="tree-line" x1="${pa.x}" y1="${pa.y}" x2="${pb.x}" y2="${pb.y}"
        stroke="${col}" stroke-width="1.5" stroke-opacity=".3"
        stroke-dasharray="none"/>`;
    }).join('');

    /* Nodes */
    const nodes = Object.entries(LAYOUT).map(([id,[c,r]]) => {
      const t = TOPIC_MAP[id];
      if (!t) return '';
      const x = c*CELL + CELL/2, y = r*CELL + CELL/2;
      const isActive = this._active === id;
      const borderCol = isActive ? 'var(--pink)' : t.phaseColor+'88';
      return `
        <div class="snode${isActive?' active':''}" data-id="${id}"
          data-tooltip="${t.fullTitle}"
          style="left:${x}px;top:${y}px;--node-color:${t.phaseColor}55">
          <div class="snode-inner" style="border-color:${borderCol};">
            <span class="snode-c1"></span><span class="snode-c2"></span>
            <span class="snode-icon">${t.icon}</span>
            <span class="snode-label">${t.label}</span>
          </div>
        </div>`;
    }).join('');

    this.innerHTML = `
      <div class="skill-tree-wrap" style="width:${W}px;height:${H}px;position:relative;">
        <svg class="tree-svg" width="${W}" height="${H}">${lines}</svg>
        ${nodes}
      </div>`;

    this.querySelectorAll('.snode').forEach(el =>
      el.addEventListener('click', () => this._select(el.dataset.id))
    );
  }

  _select(id) {
    this._active = id;
    this._render();
    document.dispatchEvent(new CustomEvent('topic-selected', { detail: { id } }));
  }

  activate(id) { this._select(id); }
}
customElements.define('skill-tree', SkillTree);

/* ═══════════════════════════════════════════════════════════════════
   CONTENT-VIEWER COMPONENT
═══════════════════════════════════════════════════════════════════ */
class ContentViewer extends HTMLElement {
  constructor() {
    super();
    this._topic = null;
    this._phase = null;
    this._activeHl = null;
    this._activeChap = null;
  }

  connectedCallback() {
    this._renderEmpty();
    document.addEventListener('topic-selected', e => {
      const found = findTopic(e.detail.id);
      if (found) this._load(found.topic, found.phase);
    });
  }

  _renderEmpty() {
    this.innerHTML = `
      <div class="viewer-empty">
        <div class="viewer-empty-icon">🍳</div>
        <div class="viewer-empty-title">Selecciona un tema</div>
        <div class="viewer-empty-sub">Elige una habilidad del árbol para comenzar</div>
        <div class="viewer-empty-arrows"><span>←</span> árbol de habilidades a la izquierda</div>
      </div>`;
  }

  _load(topic, phase) {
    this._topic = topic;
    this._phase = phase;
    this._activeHl = null;
    this._activeChap = null;
    this._render();
  }

  _loadVideo(videoId, startSec = 0) {
    const wrap = this.querySelector('.video-wrapper');
    if (!wrap) return;
    const auto = startSec > 0 ? 1 : 0;
    const src = `https://www.youtube.com/embed/${videoId}?start=${startSec}&autoplay=${auto}&rel=0&modestbranding=1&enablejsapi=1`;
    const existing = wrap.querySelector('iframe');
    if (existing) {
      existing.src = src;
    } else {
      wrap.innerHTML = `<iframe src="${src}" frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen></iframe>`;
    }
  }

  _seekTo(seconds) {
    if (!this._topic) return;
    this._loadVideo(this._topic.video.id, seconds);
  }

  _render() {
    const { _topic: t, _phase: ph } = this;
    const hasChapters = t.chapters && t.chapters.length;

    /* Build chapters HTML */
    const chapHTML = hasChapters ? `
      <div class="chapters-section">
        <div class="section-label">Capítulos</div>
        <div class="chapters-grid">
          ${t.chapters.map((ch,i) => `
            <div class="chap-card" data-sec="${ch.sec}" data-id="${ch.id}">
              <div class="chap-num">CAP. ${String(i+1).padStart(2,'0')}</div>
              <div class="chap-title">${ch.title}</div>
              <div class="chap-time">${secToStr(ch.sec)}</div>
            </div>`).join('')}
        </div>
      </div>` : '';

    /* Build highlights HTML */
    const hlHTML = t.highlights.map(h => `
      <div class="hl-item" data-sec="${h.sec}" data-id="${h.id}">
        <span class="hl-time">${h.time}</span>
        <div class="hl-info">
          <div class="hl-title">${h.title}</div>
          <div class="hl-desc">${h.desc}</div>
        </div>
        <button class="hl-play" title="Ir a ${h.time}">▶</button>
      </div>`).join('');

    this.innerHTML = `
      <div class="topic-viewer">
        <div class="topic-header">
          <div class="phase-badge" style="color:${ph.color};border-color:${ph.color}44;">
            <span class="phase-badge-dot" style="background:${ph.color};"></span>
            ${ph.label}
          </div>
          <h1 class="topic-title">${t.fullTitle}</h1>
          <p class="topic-desc">${t.desc}</p>
        </div>

        <div class="topic-body">
          <div class="video-col">
            <div class="video-wrapper">
              <div class="video-placeholder">
                <div class="video-placeholder-icon">${t.icon}</div>
                <div class="video-placeholder-text">Cargando video…</div>
              </div>
            </div>
            ${chapHTML}
          </div>

          <div class="highlights-panel">
            <div class="hl-header">
              <span class="hl-header-icon">⚡</span>
              Momentos Clave
              <span class="hl-count">${t.highlights.length} highlights</span>
            </div>
            <div class="hl-list">${hlHTML}</div>
          </div>
        </div>
      </div>`;

    /* Load video */
    this._loadVideo(t.video.id, 0);

    /* Highlight click handlers */
    this.querySelectorAll('.hl-item').forEach(el => {
      el.addEventListener('click', () => {
        const sec = parseInt(el.dataset.sec);
        this._seekTo(sec);
        this.querySelectorAll('.hl-item').forEach(x => x.classList.remove('active'));
        el.classList.add('active');
        this._activeHl = el.dataset.id;
      });
    });

    /* Chapter click handlers */
    this.querySelectorAll('.chap-card').forEach(el => {
      el.addEventListener('click', () => {
        const sec = parseInt(el.dataset.sec);
        this._seekTo(sec);
        this.querySelectorAll('.chap-card').forEach(x => x.classList.remove('active'));
        el.classList.add('active');
        this._activeChap = el.dataset.id;
      });
    });
  }
}
customElements.define('content-viewer', ContentViewer);
